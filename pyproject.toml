[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coddy"
version = "0.1.0"
description = "Coddy: Recursive Task Decomposition (RTD) Coding CLI and ACP Tool"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "docling>=2.0.0",
    "duckdb>=1.0.0",
    "falkordblite>=0.11.0",
    "fastembed>=0.9.1",
    "google-adk>=2.14.0",
    "google-adk[db]>=2.14.0",
    "google-adk[gcp]>=2.14.0",
    "jinja2>=3.1.6",
    "litellm>=1.40.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.20.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
]

[project.scripts]
coddy = "app.coddy.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["app"]
